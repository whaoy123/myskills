version: 1
updated_at: 2026-09-25
purpose: >-
  Persistent learner model for this skill. It records what the user already knows,
  what is only familiar/partial, and what is newly introduced, so later explanations
  can reuse known concepts instead of restarting from zero.

status_definitions:
  known: "用户已明确表示掌握，或能稳定、正确地使用；后续默认只做一句提醒，不重讲基础。"
  familiar: "用户学过/见过，能认出概念，但不保证能独立推导；后续先用一句回忆，再接当前电路。"
  partial: "已经解释过或用户能理解一部分，但关键因果/公式仍可能断裂；后续需要结合具体电路再讲一次。"
  new: "本轮刚引入，尚不能视为掌握。"
  uncertain: "证据不足，不能判断是否掌握；不得默认用户知道。"
  needs_correction: "用户当前理解里存在明确偏差；后续优先修正该点，但不要扩大到无关内容。"

evidence_rules:
  - "用户明确说‘这个我知道/不用讲/学过’：可提升为 known 或 familiar，取决于是否能正确使用。"
  - "用户在自己的说明中正确使用概念：至少可记为 familiar；重复正确使用或明确确认后再升 known。"
  - "用户追问‘这是什么/为什么/没理解’：对应概念不能标 known；按 new 或 partial 处理。"
  - "一次被解释过 ≠ 已掌握。解释完成后最多记为 new；后续能正确复述/应用才升级。"
  - "用户沉默、未追问，不构成掌握证据。"
  - "风格修改只更新 explanation-profile，不自动改变知识状态。"

