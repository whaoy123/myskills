schema_version: 1
state_root: "<project>/.prestudy/research_state"

required_files:
  - project.yaml
  - knowledge_model.yaml
  - research_questions.yaml
  - sources.csv
  - search_log.csv
  - evidence.jsonl
  - open_questions.yaml
  - pitfalls.yaml
  - decisions.yaml
  - project_plan.yaml
  - dida_handoff.yaml

project_stage:
  - UNDERSTAND
  - RESEARCH
  - DESIGN_PLAN

research_question_status:
  - OPEN
  - ACTIVE
  - BLOCKED
  - SATURATED
  - CLOSED

saturation_required_flags:
  - mechanism_understood
  - landscape_known
  - predecessor_known_or_not_applicable
  - evidence_adequate
  - tradeoffs_visible
  - blocking_unknowns_handled
  - low_marginal_value

open_question_type:
  - MISSING_INFORMATION
  - SOURCE_CONFLICT
  - NEEDS_EXPERIMENT
  - NEEDS_ENGINEERING_ANALYSIS
  - NEEDS_USER_DECISION

open_question_impact:
  - LOW
  - MEDIUM
  - HIGH
  - BLOCKING

pitfall_impact:
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL

pitfall_action:
  - WATCH
  - DESIGN_CONSTRAINT
  - VERIFY
  - BLOCKER

pitfall_status:
  - OPEN
  - MITIGATED
  - ACCEPTED
  - RESOLVED

decision_status:
  - PROPOSED
  - CONFIRMED
  - SUPERSEDED
  - REJECTED

evidence_type:
  - FACT
  - INFERENCE

rules:
  - FACT requires source_id and should include a locator when available.
  - INFERENCE requires one or more basis evidence IDs.
  - HIGH/CRITICAL pitfalls require evidence and mitigation.
  - CRITICAL pitfalls cannot remain WATCH-only.
  - SATURATED research questions require all stop-condition flags true.
  - CONFIRMED decisions may become hard planning assumptions.
  - Initial goal must never be overwritten by a revised current goal.
  - Reports are derived outputs and are not authoritative state.
  - Dida handoff must not own estimates, dates, priorities, or scheduling.
