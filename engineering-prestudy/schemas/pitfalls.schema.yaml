schema_version: 1
file: pitfalls.yaml
root_key: items

required_fields:
  - id
  - title
  - category
  - impact
  - action
  - status

impact:
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL

action:
  - WATCH
  - DESIGN_CONSTRAINT
  - VERIFY
  - BLOCKER

status:
  - OPEN
  - MITIGATED
  - ACCEPTED
  - RESOLVED

recommended_fields:
  - why_it_happens
  - consequence
  - mitigation
  - verification
  - evidence
  - open_question_ids

rules:
  - HIGH and CRITICAL require evidence and mitigation.
  - CRITICAL cannot use WATCH.
  - BLOCKER must prevent approval of dependent work until mitigated/resolved or explicitly reclassified.
  - Keep one authoritative pitfall record and trace downstream controls back to its id.
